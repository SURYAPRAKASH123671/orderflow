services:
  eureka-server:
    build:
      context: ./eureka-server
    container_name: orderflow-eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: orderflow-api-gateway
    depends_on:
      - eureka-server
      - redis
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      JWT_SECRET: ${ORDERFLOW_JWT_SECRET:?Copy .env.example to .env and set ORDERFLOW_JWT_SECRET}
    ports:
      - "8080:8080"

  order-service:
    build:
      context: ./order-service
    container_name: orderflow-order-service
    depends_on:
      - eureka-server
      - mysql-order
      - kafka
    environment:
      DB_URL: jdbc:mysql://mysql-order:3306/order_db
      DB_USERNAME: ${ORDERFLOW_DB_USERNAME:?Set ORDERFLOW_DB_USERNAME in .env}
      DB_PASSWORD: ${ORDERFLOW_DB_PASSWORD:?Set ORDERFLOW_DB_PASSWORD in .env}
      JPA_DDL_AUTO: update
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"

  inventory-service:
    build:
      context: ./inventory-service
    container_name: orderflow-inventory-service
    depends_on:
      - eureka-server
      - mysql-inventory
      - kafka
      - redis
    environment:
      DB_URL: jdbc:mysql://mysql-inventory:3306/inventory_db
      DB_USERNAME: ${ORDERFLOW_DB_USERNAME:?Set ORDERFLOW_DB_USERNAME in .env}
      DB_PASSWORD: ${ORDERFLOW_DB_PASSWORD:?Set ORDERFLOW_DB_PASSWORD in .env}
      JPA_DDL_AUTO: update
      CACHE_TYPE: redis
      REDIS_HOST: redis
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"

  notification-service:
    build:
      context: ./notification-service
    container_name: orderflow-notification-service
    depends_on:
      - eureka-server
      - kafka
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"

  frontend:
    build:
      context: ./frontend
    container_name: orderflow-frontend
    depends_on:
      - api-gateway
    ports:
      - "5173:80"

  mysql-order:
    image: mysql:8.4
    container_name: orderflow-mysql-order
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_USER: ${ORDERFLOW_DB_USERNAME:?Set ORDERFLOW_DB_USERNAME in .env}
      MYSQL_PASSWORD: ${ORDERFLOW_DB_PASSWORD:?Set ORDERFLOW_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ORDERFLOW_MYSQL_ROOT_PASSWORD:?Set ORDERFLOW_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - order_db_data:/var/lib/mysql

  mysql-inventory:
    image: mysql:8.4
    container_name: orderflow-mysql-inventory
    environment:
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: ${ORDERFLOW_DB_USERNAME:?Set ORDERFLOW_DB_USERNAME in .env}
      MYSQL_PASSWORD: ${ORDERFLOW_DB_PASSWORD:?Set ORDERFLOW_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ORDERFLOW_MYSQL_ROOT_PASSWORD:?Set ORDERFLOW_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - inventory_db_data:/var/lib/mysql

  kafka:
    image: apache/kafka:3.9.1
    container_name: orderflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:7.4-alpine
    container_name: orderflow-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: orderflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    container_name: orderflow-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}

volumes:
  order_db_data:
  inventory_db_data:
